version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    groups:
      runtime-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 2
    groups:
      test-and-docs-tooling:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 2
    groups:
      action-updates:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 2
