# Temporary clean-main development baseline (2026-10-20).
# Pause routine Dependabot version-update PRs while retaining security-update
# capability. Restore previous limits (npm/pip 3, test/action/docker 2)
# after the Luna-focused MJobs sprint when ready to resume version upgrades.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 0
    groups:
      runtime-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 0
    groups:
      test-and-docs-tooling:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 0
    groups:
      action-updates:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /infra/docker
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: python
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
      day: thursday
    open-pull-requests-limit: 0
