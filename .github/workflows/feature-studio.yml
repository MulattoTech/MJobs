name: Feature Studio pilot smoke
on:
  pull_request:
    paths:
      - 'feature-studio/**'
      - 'tools/feature_studio/**'
      - 'tools/agent_dashboard/static/feature-studio.html'
      - 'tools/agent_dashboard/static/index.html'
      - 'tests/unit/test_feature_studio.py'
      - 'tests/browser/test_feature_studio_browser.py'
      - '.github/workflows/feature-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feature-studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: Schema + Chromium smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock -r .github/test-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Validate versioned specifications
        run: python -m tools.feature_studio.validate --all
      - name: Run isolated tests
        run: python -m pytest -q tests/unit/test_feature_studio.py tests/browser/test_feature_studio_browser.py
