name: Browser regression - full synthetic suite
on:
  workflow_dispatch:
  schedule:
    - cron: '43 7 * * 2,5'
permissions:
  contents: read
concurrency:
  group: browser-full-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    name: Browser shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    env:
      MJOBS_OPERATION_MODE: FIXTURE
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r requirements.lock -r .github/test-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --prefix apps/web --no-audit --no-fund && npm run build --prefix apps/web
      - name: Execute disjoint browser test files
        env:
          SHARD: ${{ matrix.shard }}
        run: python -m tools.ci.run_shard --suite browser --index "$SHARD" --count 4
      - name: Test summary
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: python -m tools.ci.test_summary "outputs/ci/browser-$SHARD.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-results-${{ matrix.shard }}
          path: outputs/ci/browser-*.xml
          retention-days: 7
          if-no-files-found: ignore
