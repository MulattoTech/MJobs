name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  product-suite-and-connected-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm test --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: python -m pip install -r requirements.lock
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m tools.verification.catalogue
      - run: python -m tools.verification.progress validate
      - run: python -m cli.init_env
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: python -m cli.mock_e2e --evidence outputs/ci-mock-e2e.json
      - run: python -m cli.ui_e2e --evidence outputs/ci-ui.json
      - run: python -m cli.compose_recovery --baseline outputs/ci-mock-e2e.json --evidence outputs/ci-recovery.json
      - run: docker compose down
      - run: MJOBS_PORT=18701 MJOBS_OPERATION_MODE=PERSONAL MJOBS_COMPOSE_MOCK=0 docker compose -p mjobs-personal up -d --no-build --wait --wait-timeout 120
      - run: python -m cli.personal_mode_e2e --api http://127.0.0.1:18701 --evidence outputs/ci-personal-mode.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-mock-evidence
          path: outputs/ci-*.json
      - run: docker compose down
        if: always()
      - run: docker compose -p mjobs-personal down
        if: always()
