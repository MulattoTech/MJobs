name: CI - fast
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python / unit and integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements.txt
            .github/test-requirements.txt
      - run: python -m pip install -r requirements.lock -r .github/test-requirements.txt
      - name: Check bounded Python quality
        run: |
          python -m ruff check apps/api/application_multipage_state.py services/operations/pipeline_workbench.py services/operations/pipeline_actions.py
          python -m mypy --config-file pyproject.toml
      - name: Execute unit regressions
        run: python -m pytest -q tests/unit --junitxml=outputs/ci/unit.xml
      - name: Enforce scoped Python coverage (synthetic AI fixtures only)
        run: |
          python -m coverage run --branch --source=services/ai -m pytest -q tests/unit/test_ai_prompt_versioning.py tests/unit/test_ai_providers.py tests/unit/test_ai_structured_output.py tests/unit/test_ai_task_configuration.py tests/unit/test_ci_coverage_gate.py
          python -m coverage json -o outputs/ci/backend-coverage.json
          python -m tools.ci.coverage_gate --kind backend --report outputs/ci/backend-coverage.json --output outputs/ci/backend-coverage-gate.json
      - name: Enforce provider-task prompt/schema fixture matrix (offline)
        run: python -m tools.ci.provider_task_matrix --output outputs/ci/provider-task-matrix.json
      - name: Validate acceptance catalogues and contribution skills
        run: |
          python -m tools.verification.agent_skills
          python -m tools.verification.catalogue
          python -m tools.verification.progress validate
          python -m tools.verification.progress_dashboard --check
          python -m tools.verification.reference_provenance
      - name: Test summary
        if: always()
        run: python -m tools.ci.test_summary outputs/ci/unit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unit-results
          path: |
            outputs/ci/unit.xml
            outputs/ci/backend-coverage.json
            outputs/ci/backend-coverage-gate.json
            outputs/ci/provider-task-matrix.json
          retention-days: 7
          if-no-files-found: ignore
  web:
    name: Web / Vitest and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Lint frontend source policy
        run: npm run lint --prefix apps/web
      - name: Check frontend formatter and quality-tool rejection cases
        run: |
          npm run format:check --prefix apps/web
          npm run quality:test --prefix apps/web
      - name: Type-check frontend
        run: npm run typecheck --prefix apps/web
      - name: Test trusted automated-review policy and rejection cases
        run: node --test tests/ci/verified_review.test.cjs
      - name: Test frontend with scoped V8 coverage
        run: npm test --prefix apps/web
      - name: Enforce frontend coverage floor
        run: python -m tools.ci.coverage_gate --kind frontend --report apps/web/coverage/coverage-summary.json --output outputs/ci/frontend-coverage-gate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frontend-coverage
          path: |
            apps/web/coverage/coverage-summary.json
            outputs/ci/frontend-coverage-gate.json
          retention-days: 7
          if-no-files-found: ignore
      - run: npm run build --prefix apps/web
  repository:
    name: Repository / policy and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/test-requirements.txt -r .github/docs-requirements.txt
      - run: python -m tools.ci.check_repository
      - run: python -m tools.site.build
      - name: Whitespace check
        run: git diff --check HEAD^ HEAD
  required:
    name: CI / required
    needs: [python, web, repository]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require every gate to have actually succeeded
        run: |
          python - <<'PY'
          import json,os
          results=json.loads(os.environ['RESULTS'])
          failures={name:job['result'] for name,job in results.items() if job['result']!='success'}
          if failures:raise SystemExit('Required gates failed, skipped or cancelled: '+str(failures))
          print('All required fast gates passed.')
          PY
