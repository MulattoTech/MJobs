name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-suite-and-mock-spine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m tools.verification.catalogue
      - run: python -m cli.init_env
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: python -m cli.mock_e2e --evidence outputs/ci-mock-e2e.json
      - run: python -m cli.compose_recovery --baseline outputs/ci-mock-e2e.json --evidence outputs/ci-recovery.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-mock-evidence
          path: outputs/ci-*.json
      - run: docker compose down
        if: always()
