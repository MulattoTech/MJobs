name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  product-suite-and-connected-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm test --prefix apps/web
      - run: npm run build --prefix apps/web
      - run: python -m pip install -r requirements.lock
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m tools.verification.agent_skills
      - run: python -m tools.verification.catalogue
      - run: python -m tools.verification.progress validate
      - run: python -m cli.init_env
      - run: MJOBS_OPERATION_MODE=FIXTURE MJOBS_COMPOSE_MOCK=1 docker compose --profile fixture up -d --build --wait --wait-timeout 120
      - run: python -c "import subprocess; services=subprocess.check_output(['docker','compose','--profile','fixture','ps','--services','--status','running'], text=True).splitlines(); assert 'mock' in services, services"
      - name: Assert fixture PostgreSQL revision and workspace identity
        run: |
          expected_revision="$(python -m alembic heads | awk '{print $1}')"
          test -n "$expected_revision"
          test "$(docker compose --profile fixture exec -T postgres psql -U mjobs -d mjobs -Atc 'SELECT version_num FROM alembic_version')" = "$expected_revision"
          test "$(docker compose --profile fixture exec -T postgres psql -U mjobs -d mjobs -Atc 'SELECT operation_mode FROM workspace_identity')" = FIXTURE
      - run: python -m cli.mock_e2e --evidence outputs/ci-mock-e2e.json
      - run: python -m cli.ui_e2e --evidence outputs/ci-ui.json
      - name: Verify real offline scanned-resume OCR in the app image
        run: docker compose exec -T api python -m cli.profile_ocr_e2e > outputs/ci-profile-ocr.json
      - name: Verify uploaded original comparison with real offline OCR
        run: docker compose exec -T api python -m cli.uploaded_resume_comparison_e2e > outputs/ci-uploaded-resume-comparison.json
      - name: Verify Unicode fidelity, ATS structure and assertion rejection in the app image
        run: docker compose exec -T api python -m unittest tests.integration.test_document_validation tests.integration.test_ats_templates -v
      - run: python -m cli.compose_recovery --baseline outputs/ci-mock-e2e.json --evidence outputs/ci-recovery.json
      - run: docker compose --profile fixture down
      - run: MJOBS_PORT=18701 MJOBS_OPERATION_MODE=PERSONAL MJOBS_COMPOSE_MOCK=0 COMPOSE_PROFILES='' docker compose -p mjobs-personal up -d --no-build --wait --wait-timeout 120
      - run: python -c "import subprocess; services=subprocess.check_output(['docker','compose','-p','mjobs-personal','ps','--services','--status','running'], text=True).splitlines(); assert 'mock' not in services and {'api','worker','source-worker','document-worker'} <= set(services), services"
      - name: Assert personal PostgreSQL revision and workspace identity
        run: |
          expected_revision="$(python -m alembic heads | awk '{print $1}')"
          test -n "$expected_revision"
          test "$(docker compose -p mjobs-personal exec -T postgres psql -U mjobs -d mjobs -Atc 'SELECT version_num FROM alembic_version')" = "$expected_revision"
          test "$(docker compose -p mjobs-personal exec -T postgres psql -U mjobs -d mjobs -Atc 'SELECT operation_mode FROM workspace_identity')" = PERSONAL
      - run: python -m cli.personal_mode_e2e --api http://127.0.0.1:18701 --evidence outputs/ci-personal-mode.json
      - id: personal_public_read
        continue-on-error: true
        run: python -m cli.public_source_probe --base-url http://127.0.0.1:18701 --tenant greenhouse --required-mode PERSONAL --evidence outputs/ci-personal-public-source.json
      - if: steps.personal_public_read.outcome == 'success'
        continue-on-error: true
        run: python -m cli.ui_source_readback --base-url http://127.0.0.1:18701 --evidence outputs/ci-personal-public-ui.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fictional-mock-evidence
          path: outputs/ci-*.json
      - run: docker compose --profile fixture down
        if: always()
      - run: docker compose -p mjobs-personal down
        if: always()
