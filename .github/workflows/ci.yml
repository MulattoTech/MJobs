name: CI — fast

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python / unit and integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            .github/test-requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock -r .github/test-requirements.txt
      - name: Run Python unit tests
        run: python -m pytest -q tests/unit
      - name: Verify catalogue, agent skills, and progress
        run: |
          python -m tools.verification.agent_skills
          python -m tools.verification.catalogue
          python -m tools.verification.progress validate
          python -m tools.verification.progress_dashboard --check
      - name: Check whitespace and conflict markers
        run: |
          git diff --check HEAD^ HEAD
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- ':!docs/evidence/*'; then
            echo 'Unresolved merge-conflict marker found.'
            exit 1
          fi

  web:
    name: Web / Vitest and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm test --prefix apps/web
      - run: npm run build --prefix apps/web
