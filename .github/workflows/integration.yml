name: Integration - PostgreSQL and Redis
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    name: Integration / PostgreSQL and Redis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mjobs
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: mjobs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mjobs -d mjobs_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MJOBS_TEST_POSTGRES_URL: postgresql+psycopg://mjobs:synthetic-test-only@127.0.0.1:5432/mjobs_test
      MJOBS_WORKER_RECOVERY_POSTGRES_URL: postgresql+psycopg://mjobs:synthetic-test-only@127.0.0.1:5432/mjobs_worker_recovery
      MJOBS_REDIS_URL: redis://127.0.0.1:6379/0
      MJOBS_OPERATION_MODE: FIXTURE
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            .github/test-requirements.txt
      - run: python -m pip install -r requirements.lock -r .github/test-requirements.txt
      - name: Create a disposable recovery database
        run: psql -h 127.0.0.1 -U mjobs -d mjobs_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mjobs_worker_recovery'
      - name: Install controlled browser dependency for worker tests
        run: python -m playwright install --with-deps chromium
      - name: Integration tests with disposable services
        run: python -m pytest -q tests/integration --junitxml=outputs/ci/integration.xml
      - name: Test summary
        if: always() && hashFiles('tools/ci/test_summary.py') != ''
        run: python -m tools.ci.test_summary outputs/ci/integration.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-results
          path: outputs/ci/integration.xml
          retention-days: 7
          if-no-files-found: ignore
