name: Integration - PostgreSQL and Redis
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  shard:
    name: Integration / shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mjobs
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: mjobs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mjobs -d mjobs_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MJOBS_TEST_POSTGRES_URL: postgresql+psycopg://mjobs:synthetic-test-only@127.0.0.1:5432/mjobs_test
      MJOBS_WORKER_RECOVERY_POSTGRES_URL: postgresql+psycopg://mjobs:synthetic-test-only@127.0.0.1:5432/mjobs_worker_recovery
      MJOBS_APPLICATION_CRASH_POSTGRES_URL: postgresql+psycopg://mjobs:synthetic-test-only@127.0.0.1:5432/mjobs_test_application_crash
      MJOBS_REDIS_URL: redis://127.0.0.1:6379/0
      MJOBS_T11_REDIS_URL: redis://127.0.0.1:6379/14
      MJOBS_OPERATION_MODE: FIXTURE
      MJOBS_DURABLE_COMPARISON_POSTGRES_URL: postgresql+psycopg://mjobs:synthetic-test-only@127.0.0.1:5432/mjobs_test
      MJOBS_BACKUP_CREDENTIAL_TEST_POSTGRES_URL: postgresql+psycopg://mjobs:synthetic-test-only@127.0.0.1:5432/mjobs_test_backup_credentials
      MJOBS_DURABLE_EXTRACTION_POSTGRES_URL: postgresql+psycopg://mjobs:synthetic-test-only@127.0.0.1:5432/mjobs_test_durable_extraction
      MJOBS_AI_EVALUATION_POSTGRES_URL: postgresql+psycopg://mjobs:synthetic-test-only@127.0.0.1:5432/mjobs_test_durable_extraction
      MJOBS_REVIEWED_IDENTITY_POSTGRES_URL: postgresql+psycopg://mjobs:synthetic-test-only@127.0.0.1:5432/mjobs_test_durable_extraction
      MJOBS_AI_REDIS_TEST_URL: redis://127.0.0.1:6379/15
      MJOBS_PRIORITY_POSTGRES_URL: postgresql+psycopg://mjobs:synthetic-test-only@127.0.0.1:5432/mjobs_priority_validation
      MJOBS_PRIORITY_REDIS_URL: redis://127.0.0.1:6379/15
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/test-requirements.txt
      - run: python -m pip install -r requirements.lock -r .github/test-requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build the same SPA mounted by production API integration tests
        run: npm ci --prefix apps/web --no-audit --no-fund && npm run build --prefix apps/web
      - name: Create disposable recovery acceptance databases
        run: |
          psql -h 127.0.0.1 -U mjobs -d mjobs_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mjobs_worker_recovery'
          psql -h 127.0.0.1 -U mjobs -d mjobs_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mjobs_test_application_crash'
          psql -h 127.0.0.1 -U mjobs -d mjobs_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mjobs_test_backup_credentials'
          psql -h 127.0.0.1 -U mjobs -d mjobs_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mjobs_test_durable_extraction'
          psql -h 127.0.0.1 -U mjobs -d mjobs_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mjobs_priority_validation'
      - name: Install controlled browser dependency for worker tests
        run: python -m playwright install --with-deps chromium
      - name: Execute each integration test file in exactly one isolated shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python -m tools.ci.run_shard --suite integration --index "$SHARD" --count 3
      - name: Test summary
        if: always() && hashFiles('tools/ci/test_summary.py') != ''
        env:
          SHARD: ${{ matrix.shard }}
        run: python -m tools.ci.test_summary "outputs/ci/integration-$SHARD.xml"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integration-results-${{ matrix.shard }}
          path: outputs/ci/integration-*.xml
          retention-days: 7
          if-no-files-found: ignore
  required:
    name: Integration / PostgreSQL and Redis
    needs: shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      RESULT: ${{ needs.shard.result }}
    steps:
      - name: Require all integration shards to have passed
        run: |
          if [ "$RESULT" != success ]; then
            echo "Integration shards did not all succeed: $RESULT"
            exit 1
          fi
          echo 'Every integration shard passed with isolated PostgreSQL and Redis.'
