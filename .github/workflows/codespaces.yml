name: Codespaces Environment

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.vscode/tasks.json'
      - 'docs/CODESPACES.md'
      - 'requirements.lock'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - '.github/workflows/codespaces.yml'
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.vscode/tasks.json'
      - 'docs/CODESPACES.md'
      - 'requirements.lock'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - '.github/workflows/codespaces.yml'

permissions:
  contents: read

jobs:
  devcontainer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build MJobs dev container and smoke-test it
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            bash .devcontainer/setup.sh
            bash .devcontainer/verify.sh quick
