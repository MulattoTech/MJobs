name: Codespaces Environment
# Archived for reference; no automatic events or executable jobs.
# Re-enablement requires an explicit new user instruction.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  devcontainer-smoke:
    # User budget policy: repository Actions is also disabled.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require the tested PR merge tree to equal the exact candidate tree
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$PR_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "${PR_HEAD}^{tree}")"
      - name: Build MJobs dev container and smoke-test it
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            bash -euo pipefail -c '
              bash .devcontainer/setup.sh
              bash .devcontainer/test-bootstrap.sh
              bash .devcontainer/bootstrap-codex.sh
              codex --version
              test -f .agents/skills/mjobs-delivery/SKILL.md
              bash .devcontainer/verify.sh quick
            '
