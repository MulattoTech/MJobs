name: Codespaces environment

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/codespaces.yml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: codespaces-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  devcontainer-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Bootstrap devcontainer without launching agents
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          runCmd: |
            bash -euo pipefail -c '
              bash .devcontainer/setup.sh
              bash .devcontainer/test-bootstrap.sh
              test -f .agents/skills/mjobs-delivery/SKILL.md
              bash .devcontainer/verify.sh quick
            '
