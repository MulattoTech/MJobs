name: Fleet control - Windows
on:
  pull_request:
    branches: [main]
    paths: ['tools/fleet_control/**', '.github/workflows/fleet-control.yml']
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths: ['tools/fleet_control/**', '.github/workflows/fleet-control.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fleet-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    name: Fleet / Windows control regressions
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Resolve reviewed Fleet Hub source pin
        id: pinned
        shell: pwsh
        run: |
          $pin = Get-Content 'tools/fleet_control/source.json' -Raw | ConvertFrom-Json
          if ($pin.repository -ne 'MulattoTech/Fleet-Control-Hub' -or $pin.package -ne 'packages/mjobs-controller' -or $pin.revision -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Fleet source pin must identify the reviewed Hub package and an exact commit'
          }
          "revision=$($pin.revision)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: MulattoTech/Fleet-Control-Hub
          ref: ${{ steps.pinned.outputs.revision }}
          path: .fleet-source
          persist-credentials: false
      - name: Verify checked-out Hub matches the signed source pin
        shell: pwsh
        run: |
          $expected = (Get-Content 'tools/fleet_control/source.json' -Raw | ConvertFrom-Json).revision
          $actual = (git -C .fleet-source rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw 'Fleet CI loaded a different Hub revision than the signed source pin' }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Verify shared source manifest
        run: node .fleet-source/scripts/controller-package.js verify mjobs-controller
      - name: Test shared controls with isolated fixtures and no inference
        run: node .fleet-source/packages/mjobs-controller/check-fleet.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fleet-control-regressions
          path: .fleet-source/packages/mjobs-controller/diagnostics/preflight-results.json
          retention-days: 7
          if-no-files-found: error
