name: Secret scan - reviewed history
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '31 6 * * 3'
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: Security / secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Scan with checksum-verified binary and narrow reviewed fingerprints
        run: python -m tools.ci.secret_scan
      - name: Publish bounded redacted diagnostics only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: redacted-secret-candidates
          path: outputs/ci/secret-scan-redacted.json
          retention-days: 3
          if-no-files-found: ignore
