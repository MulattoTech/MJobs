name: Connected acceptance — synthetic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1' # Weekly, UTC

permissions:
  contents: read

concurrency:
  group: synthetic-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-stack:
    name: Disposable Compose / mock end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MJOBS_OPERATION_MODE: FIXTURE
      MJOBS_COMPOSE_MOCK: '1'
      COMPOSE_PROFILES: fixture
      MJOBS_PORT: '18700'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Install headless Chromium for isolated UI checks
        run: python -m playwright install --with-deps chromium
      - name: Generate disposable synthetic secrets
        run: python -m cli.init_env
      - name: Assign a disposable, recovery-guard-compliant Compose project
        shell: bash
        run: |
          echo "COMPOSE_PROJECT_NAME=mjobs-fixture-$(python -c 'import secrets; print(secrets.token_hex(6))')" >> "$GITHUB_ENV"
      - name: Build and start disposable fixture stack
        run: docker compose --profile fixture up -d --build --wait --wait-timeout 180
      - name: Controlled mock source + ATS end-to-end
        run: python -m cli.mock_e2e --evidence outputs/ci-mock-e2e.json
      - name: Browser-integrated UI acceptance
        run: python -m cli.ui_e2e --evidence outputs/ci-ui.json
      - name: Restart and persistence recovery
        run: python -m cli.compose_recovery --baseline outputs/ci-ui.json --evidence outputs/ci-recovery.json --project-name "$COMPOSE_PROJECT_NAME" --port "$MJOBS_PORT"
      - name: Upload bounded fictional result summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-acceptance-json
          path: outputs/ci-*.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove disposable GitHub-runner containers
        if: always()
        run: docker compose --profile fixture down --remove-orphans
