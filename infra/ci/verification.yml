name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  domain-and-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m tools.verification.catalogue
