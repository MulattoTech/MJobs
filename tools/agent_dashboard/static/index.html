<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MJobs Agent Control</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header>
  <div>
    <h1>MJobs Agent Control</h1>
    <p>Verified local agent processes · worktree isolated · loopback only</p>
  </div>
  <div class="header-actions">
    <span id="gpuState" class="pill">GPU …</span>
    <span id="mainState" class="pill">loading…</span>
    <button id="refreshBtn">Refresh</button>
    <button id="stopAllBtn" class="danger">Stop all</button>
  </div>
</header>

<main>
  <section id="alerts"></section>
  <section id="lanes" class="lane-grid"></section>

  <section class="panel repo-panel">
    <div class="panel-title">
      <h2>Repository & coordination</h2>
      <span id="updatedAt"></span>
    </div>
    <div id="repoSummary" class="repo-summary"></div>
    <details>
      <summary>Claims / lock / worktrees</summary>
      <pre id="coordination"></pre>
    </details>
  </section>
</main>

<template id="laneTemplate">
  <article class="panel lane-card">
    <div class="lane-title">
      <div>
        <h2 class="lane-name"></h2>
        <div class="lane-runner"></div>
      </div>
      <div class="status-stack">
        <span class="activity pill"></span>
        <span class="status pill"></span>
      </div>
    </div>

    <div class="metrics metrics-six">
      <div><span>PID</span><strong class="pid">—</strong></div>
      <div><span>Issue</span><strong class="issue">—</strong></div>
      <div><span>Last output</span><strong class="last-activity">—</strong></div>
      <div><span>Session</span><strong class="session">—</strong></div>
      <div><span>RAM</span><strong class="memory">—</strong></div>
      <div><span>GPU</span><strong class="lane-gpu">—</strong></div>
    </div>

    <div class="usage-panel">
      <div class="usage-head">
        <strong class="usage-title">Usage</strong>
        <span class="usage-percent"></span>
      </div>
      <div class="progress"><div class="usage-fill"></div></div>
      <div class="usage-meta"></div>
    </div>

    <div class="codex-stats interface-stats hidden">
      <div class="stats-section">
        <div class="stats-title">Current Codex model turn</div>
        <div class="token-grid codex-turn-grid"></div>
      </div>
      <div class="stats-section">
        <div class="stats-title">Current Codex session</div>
        <div class="token-grid codex-session-grid"></div>
      </div>
      <div class="stats-section">
        <div class="stats-title">This MJobs worktree</div>
        <div class="token-grid codex-worktree-grid"></div>
      </div>
      <div class="stats-section">
        <div class="stats-title">Selected Codex model on MJobs</div>
        <div class="token-grid codex-model-grid"></div>
      </div>
      <details>
        <summary>Tool calls / raw Codex statistics</summary>
        <pre class="codex-raw-stats"></pre>
      </details>
    </div>

    <div class="antigravity-stats interface-stats hidden">
      <div class="stats-section">
        <div class="stats-title">Current / last Antigravity conversation</div>
        <div class="token-grid antigravity-current-grid"></div>
      </div>
      <div class="stats-section">
        <div class="stats-title">This MJobs worktree</div>
        <div class="token-grid antigravity-worktree-grid"></div>
      </div>
      <div class="stats-section">
        <div class="stats-title">Configured-model MJobs history</div>
        <div class="token-grid antigravity-model-grid"></div>
      </div>
      <details>
        <summary>Thinking / tool calls / raw Antigravity statistics</summary>
        <pre class="antigravity-raw-stats"></pre>
      </details>
    </div>

    <div class="ollama-stats hidden">
      <div class="stats-section">
        <div class="stats-title">Current OpenCode session</div>
        <div class="token-grid current-token-grid"></div>
      </div>
      <div class="stats-section">
        <div class="stats-title">This MJobs worktree</div>
        <div class="token-grid worktree-token-grid"></div>
      </div>
      <div class="stats-section">
        <div class="stats-title">Selected model usage</div>
        <div class="token-grid model-token-grid"></div>
      </div>
      <details>
        <summary>Tool calls / raw local-model statistics</summary>
        <pre class="ollama-raw-stats"></pre>
      </details>
    </div>

    <div class="gpu-control hidden">
      <label>GPU offload cap: <strong class="gpu-offload-value">100%</strong>
        <input type="range" class="gpu-offload" min="0" max="100" step="5" value="100">
      </label>
      <div class="helper">Maps the percentage to Ollama <code>num_gpu</code> model layers. This is an enforceable offload cap, not a promise that Task Manager utilization stays at that exact percentage. Applies after restart.</div>
    </div>

    <label>Model
      <input class="model" spellcheck="false">
    </label>
    <label>Reasoning / effort
      <input class="reasoning" spellcheck="false">
    </label>
    <label class="check-row">
      <input type="checkbox" class="auto-continue">
      <span>Auto-continue after clean completion</span>
    </label>
    <label>Prompt override
      <textarea class="prompt" rows="4" placeholder="Optional instructions appended to the lane prompt"></textarea>
    </label>

    <div class="buttons">
      <button class="save">Save settings</button>
      <button class="start primary">Start</button>
      <button class="restart">Restart</button>
      <button class="stop danger">Stop</button>
    </div>
    <div class="reason"></div>
    <div class="workspace"></div>

    <details>
      <summary>Process proof</summary>
      <pre class="process-proof"></pre>
    </details>
    <details open class="terminal-details">
      <summary>Live terminal</summary>
      <div class="terminal-toolbar">
        <span class="terminal-connection pill">connecting</span>
        <span class="terminal-run"></span>
        <label class="check-row compact"><input type="checkbox" class="terminal-follow" checked><span>Follow</span></label>
        <button class="terminal-pause">Pause</button>
        <button class="terminal-clear">Clear view</button>
        <button class="terminal-grow">Expand</button>
      </div>
      <pre class="terminal" aria-label="Live terminal output"></pre>
    </details>
  </article>
</template>

<script src="/static/app.js"></script>
</body>
</html>
