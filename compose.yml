name: mjobs
x-rotating-logging: &rotating-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"
x-runtime: &runtime
  image: mjobs-local:spine
  build:
    context: .
    dockerfile: infra/docker/Dockerfile
  init: true
  entrypoint: [python, -m, cli.runtime_database]
  cpus: 2
  mem_limit: 2g
  logging: *rotating-logging
  environment: &environment
    MJOBS_DATABASE_URL_FILE: /run/mjobs-database/runtime-url
    MJOBS_REDIS_URL: redis://redis:6379/0
    MJOBS_MOCK_ORIGIN: http://mock:8090
    MJOBS_COMPOSE_MOCK: ${MJOBS_COMPOSE_MOCK:-0}
    MJOBS_OPERATION_MODE: ${MJOBS_OPERATION_MODE:-PERSONAL}
    MJOBS_OUTPUT_DIR: /data/documents
    MJOBS_SOURCE_COLLECTION_CONCURRENCY: ${MJOBS_SOURCE_COLLECTION_CONCURRENCY:-2}
    MJOBS_COMPANY_DISCOVERY_CONCURRENCY: ${MJOBS_COMPANY_DISCOVERY_CONCURRENCY:-1}
    MJOBS_AI_CONCURRENCY: ${MJOBS_AI_CONCURRENCY:-1}
    MJOBS_DOCUMENT_GENERATION_CONCURRENCY: ${MJOBS_DOCUMENT_GENERATION_CONCURRENCY:-1}
    MJOBS_APPLICATION_AUTOMATION_CONCURRENCY: ${MJOBS_APPLICATION_AUTOMATION_CONCURRENCY:-1}
    MJOBS_TRANSIENT_RETENTION_CONFIG: ${MJOBS_TRANSIENT_RETENTION_CONFIG:-}
    MJOBS_TRANSIENT_RETENTION_INTERVAL_SECONDS: ${MJOBS_TRANSIENT_RETENTION_INTERVAL_SECONDS:-86400}
  volumes:
    - documents:/data/documents
    - runtime-database:/run/mjobs-database:ro
  networks: [private]
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *rotating-logging
    environment:
      POSTGRES_USER: mjobs
      POSTGRES_DB: mjobs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python cli/init_env.py}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mjobs -d mjobs']
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [private]
    mem_limit: 512m
  redis:
    image: redis:7
    restart: unless-stopped
    logging: *rotating-logging
    command: [redis-server, --appendonly, 'yes']
    volumes: [queue:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [private]
    mem_limit: 256m
  migrate:
    <<: *runtime
    entrypoint: []
    command: [python, -m, cli.provision_database]
    environment:
      MJOBS_DATABASE_URL: postgresql+psycopg://mjobs:${POSTGRES_PASSWORD:?Run python cli/init_env.py}@postgres/mjobs
      MJOBS_DATABASE_URL_FILE: /run/mjobs-database/runtime-url
    volumes:
      - runtime-database:/run/mjobs-database
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *runtime
    environment:
      <<: *environment
      MJOBS_CREDENTIAL_ENCRYPTION_KEY: ${MJOBS_CREDENTIAL_ENCRYPTION_KEY:?Run python -m cli/init_env}
    command: [python, -m, uvicorn, apps.api.main:create_from_env, --factory, --host, 0.0.0.0, --port, '8000']
    ports: ['127.0.0.1:${MJOBS_PORT:-18700}:8000']
    networks: [private, ui, source-egress]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
  mock:
    <<: *runtime
    profiles: [fixture]
    command: [python, -m, fixtures.mock_server]
    environment:
      MOCK_RECEIPT_FILE: /data/receipts.json
    volumes: [mock-receipts:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 3s
      timeout: 4s
      retries: 20
  worker:
    <<: *runtime
    command: [python, -m, workers.main]
    restart: unless-stopped
    environment:
      <<: *environment
      MJOBS_WORKER_QUEUE: mjobs-application
      MJOBS_BROWSER_DEBUG_CAPTURE: ${MJOBS_BROWSER_DEBUG_CAPTURE:-0}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  scheduler:
    <<: *runtime
    command: [python, -m, services.discovery.scheduler]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
  source-worker:
    <<: *runtime
    networks: [private, source-egress]
    command: [python, -m, workers.main]
    restart: unless-stopped
    environment:
      <<: *environment
      MJOBS_WORKER_QUEUE: mjobs-discovery
      MJOBS_BROWSER_DEBUG_CAPTURE: ${MJOBS_BROWSER_DEBUG_CAPTURE:-0}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  company-discovery-worker:
    <<: *runtime
    networks: [private, source-egress]
    command: [python, -m, workers.company_discovery_worker]
    restart: unless-stopped
    environment:
      <<: *environment
      MJOBS_WORKER_QUEUE: mjobs-company-discovery
      MJOBS_BROWSER_DEBUG_CAPTURE: ${MJOBS_BROWSER_DEBUG_CAPTURE:-0}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  ai-worker:
    <<: *runtime
    networks: [private, source-egress]
    command: [python, -m, workers.main]
    restart: unless-stopped
    environment:
      <<: *environment
      MJOBS_WORKER_QUEUE: mjobs-ai
      MJOBS_CREDENTIAL_ENCRYPTION_KEY: ${MJOBS_CREDENTIAL_ENCRYPTION_KEY:?Run python -m cli/init_env}
      MJOBS_OLLAMA_BASE_URL: ${MJOBS_OLLAMA_BASE_URL:-http://127.0.0.1:11434}
      MJOBS_OPENAI_BASE_URL: ${MJOBS_OPENAI_BASE_URL:-https://api.openai.com/v1}
      MJOBS_OPENAI_API_KEY: ${MJOBS_OPENAI_API_KEY:-}
      MJOBS_OPENAI_COMPATIBLE_BASE_URL: ${MJOBS_OPENAI_COMPATIBLE_BASE_URL:-https://api.openai.com/v1}
      MJOBS_OPENAI_COMPATIBLE_API_KEY: ${MJOBS_OPENAI_COMPATIBLE_API_KEY:-}
      MJOBS_LOCAL_AI_BASE_URL: ${MJOBS_LOCAL_AI_BASE_URL:-http://127.0.0.1:8080/v1}
      MJOBS_LOCAL_AI_API_KEY: ${MJOBS_LOCAL_AI_API_KEY:-}
      MJOBS_AZURE_OPENAI_BASE_URL: ${MJOBS_AZURE_OPENAI_BASE_URL:-https://example-resource.openai.azure.com}
      MJOBS_AZURE_OPENAI_API_KEY: ${MJOBS_AZURE_OPENAI_API_KEY:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  document-worker:
    <<: *runtime
    command: [python, -m, workers.main]
    restart: unless-stopped
    environment:
      <<: *environment
      MJOBS_WORKER_QUEUE: mjobs-document
      MJOBS_BROWSER_DEBUG_CAPTURE: ${MJOBS_BROWSER_DEBUG_CAPTURE:-0}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
networks:
  private:
    internal: true
  ui:
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1
  source-egress:
    # The read-only adapter validates one fixed provider HTTPS origin. No host ports.
    driver: bridge
volumes:
  database:
  queue:
  documents:
  mock-receipts:
  runtime-database:
